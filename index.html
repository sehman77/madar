<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مَدار — بين النص والتطبيق</title>
<meta name="description" content="مَدار: أرشيف نقاشات سلسلة «بين النص والتطبيق» في أكاديمية نخبة التعليم — إجابة دقيقة، وسند نظامي، وخبرة متبادلة.">
<meta name="theme-color" content="#0b3f45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%230e5a63'/%3E%3Cg transform='rotate(-28 60 60)'%3E%3Cellipse cx='60' cy='60' rx='46' ry='19' fill='none' stroke='%23e9c27a' stroke-width='6'/%3E%3C/g%3E%3Ccircle cx='60' cy='60' r='20' fill='%23fff'/%3E%3Ccircle cx='22' cy='81' r='8' fill='%23c99a3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15282a; --ink2:#4d5f61; --muted:#8b9a9b;
  --paper:#f6f3ec; --card:#fff; --line:#e6e0d3;
  --teal:#0e5a63; --teal-d:#0b3f45; --teal-s:#e6f1f0;
  --gold:#c99a3d; --gold-l:#e9c27a; --gold-s:#faf2e1;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
.lt{unicode-bidi:isolate;direction:ltr;white-space:nowrap}

/* ---------- الرأس ---------- */
.hdr{background:var(--teal-d);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:10}
.hdr .in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff}
.brand svg{width:42px;height:42px}
.brand b{display:block;font-size:22px;line-height:1.1}
.brand small{display:block;font-size:10.5px;letter-spacing:3px;color:var(--gold-l);font-weight:600;direction:ltr;text-align:right}
.homebtn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600}
.homebtn svg{width:18px;height:18px}
.hdr .acad{font-size:12px;color:#cfe0e1;text-align:left;line-height:1.4}

main{max-width:760px;margin:0 auto;padding:18px 16px 120px}

/* ---------- البطل ---------- */
.hero{background:linear-gradient(155deg,#0e5a63 0%,#0b3f45 70%);color:#fff;border-radius:26px;padding:26px 22px 22px;position:relative;overflow:hidden}
.hero .orbit{position:absolute;inset-inline-start:-90px;top:-70px;width:300px;height:300px;opacity:.13}
.hero .k{font-size:13px;color:var(--gold-l);font-weight:600}
.hero .idea{font-size:13.5px;color:#fff;opacity:.9;margin-top:2px}
.hero h1{font-family:"IBM Plex Sans Arabic";font-size:30px;line-height:1.5;margin:4px 0 8px;font-weight:700}
.hero p{color:#d9e7e7;font-size:15px;max-width:520px}
.motto{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.motto span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:3px 14px;font-size:13.5px;font-weight:500}
.live{margin-top:18px;background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.live .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.live.on .dot{background:#2bb673;box-shadow:0 0 0 0 rgba(43,182,115,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(43,182,115,0)}100%{box-shadow:0 0 0 0 rgba(43,182,115,0)}}
.live b{display:block;font-size:15.5px}
.live small{color:var(--ink2);font-size:13px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--teal);line-height:1.3}
.stat small{font-size:12px;color:var(--ink2)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec h2{font-size:19px;font-weight:700}
.sec a,.sec button{font-size:13.5px;color:var(--teal);font-weight:600}

/* ---------- أسبوع المحاور ---------- */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer;transition:.2s}
.wd .d{font-size:12px;color:var(--ink2);font-weight:600}
.wd .ic{width:38px;height:38px;border-radius:12px;margin:6px auto;display:grid;place-items:center}
.wd .ic svg{width:21px;height:21px}
.wd .t{font-size:11.5px;line-height:1.45;font-weight:600}
.wd.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-s)}
.wd.today .d{color:var(--gold)}

/* ---------- بطاقة اللقاء في القائمة ---------- */
.sc{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;color:var(--ink);position:relative;transition:.2s}
.sc:active{transform:scale(.995)}
.sc .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.sc .q{font-family:"IBM Plex Sans Arabic";font-size:16.5px;line-height:1.85;margin:8px 0 10px;font-weight:600}
.sc .foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.avs{display:flex}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;border:2px solid #fff;margin-inline-start:-8px}
.avs .av:first-child{margin-inline-start:0}
.demo-tag{background:#fdeee9;color:#a04a35}

/* ---------- صفحة اللقاء ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-bottom:12px}
.sess-h{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.sess-h .no{position:absolute;inset-inline-end:18px;top:14px;font-family:"IBM Plex Sans Arabic";font-size:54px;font-weight:700;color:var(--teal-s);line-height:1}
.sess-h .qlabel{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:12px}
.sess-h .q{font-family:"IBM Plex Sans Arabic";font-size:19px;line-height:1.9;font-weight:600;color:#10292b;margin-top:2px}
.sess-h .by{font-size:13px;color:var(--ink2);margin-top:8px}
.banner{background:#fdeee9;color:#8a3d2b;border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px;font-weight:600;font-size:14.5px}
.btn svg{width:18px;height:18px}
.btn.p{background:var(--teal);color:#fff}
.btn.g{background:var(--card);border:1px solid var(--line)}

.blk{margin-top:22px}
.blk>h3{font-size:16.5px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.blk>h3 i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--teal-s);color:var(--teal);font-style:normal;font-size:13px;font-weight:700}

.refs{display:flex;flex-direction:column;gap:8px}
.ref{display:flex;gap:12px;align-items:center;background:var(--gold-s);border:1px solid #f0e2c2;border-radius:14px;padding:10px 14px}
.ref .art{flex:none;text-align:center;line-height:1.15;color:#7a5a1c}
.ref .art small{font-size:10.5px;display:block}
.ref .art b{font-family:"IBM Plex Sans Arabic";font-size:22px}
.ref .law{font-weight:600;font-size:14.5px}
.ref .det{font-size:12.5px;color:#7a6a4a}

/* خيط النقاش */
.thread{position:relative;padding-inline-start:0}
.ct{display:flex;gap:12px;margin-bottom:14px}
.ct .av{width:40px;height:40px;font-size:15px;margin:0;border:0;flex:none}
.ct .bub{flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px}
.ct.reply{margin-inline-start:30px}
.ct .who{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13.5px}
.ct .who b{font-weight:700}
.ct .who .tm{color:var(--muted);font-size:12px;margin-inline-start:auto}
.ct p{margin-top:4px;font-size:15.5px;line-height:1.95;white-space:pre-line}
.ct .cite{display:inline-flex;flex-wrap:wrap;gap:4px 8px;margin-top:8px;font-size:12.5px;background:var(--teal-s);color:var(--teal);padding:3px 10px;border-radius:8px;font-weight:600}
.k-sanad{background:var(--teal-s);color:var(--teal)}
.k-khibra{background:var(--gold-s);color:#8a6418}
.k-sual{background:#eef0f7;color:#46508a}
.k-idafa{background:#f0f4ea;color:#4f6b2c}
.k-ray{background:#f1eef6;color:#5d4a86}
.k-tasheeh{background:#fdeee9;color:#a04a35}
.k-ishraf{background:#0e5a63;color:#fff}
.ct .cite{display:flex;width:fit-content}
.ct .re{font-size:12px;color:var(--muted);margin-top:2px}
.note-m{background:var(--gold-s);border-inline-start:4px solid var(--gold);border-radius:14px;padding:12px 16px}
.note-m b{font-size:13px;color:#8a6418}
.note-m p{font-family:"IBM Plex Sans Arabic";font-size:16.5px;line-height:1.95;white-space:pre-line;margin-top:2px}
.answer{background:var(--card);border:2px solid var(--teal);border-radius:20px;padding:16px 18px}
.answer .al{display:inline-block;background:var(--teal);color:#fff;border-radius:99px;padding:1px 12px;font-size:12.5px;font-weight:700}
.answer .ab{font-size:13px;color:var(--ink2);margin-top:6px}
.answer p{white-space:pre-line;line-height:2;font-size:15.5px;margin-top:6px}
.trunc{margin-top:8px;font-size:12.5px;color:#a04a35}
.side-intro{font-size:13.5px;color:var(--ink2);margin:-4px 2px 10px}

.sum{background:linear-gradient(160deg,#0e5a63,#0b3f45);color:#fff;border-radius:22px;padding:20px}
.sum h3{color:var(--gold-l);font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sum ol{list-style:none;counter-reset:n}
.sum li{counter-increment:n;position:relative;padding-inline-start:34px;margin:8px 0;line-height:1.85;font-size:15px}
.sum li::before{content:counter(n,arabic-indic);position:absolute;inset-inline-start:0;top:2px;width:24px;height:24px;border-radius:50%;background:rgba(233,194,122,.18);color:var(--gold-l);font-weight:700;font-size:13px;display:grid;place-items:center;line-height:1}
.apply{background:var(--card);border:1.5px dashed var(--teal);border-radius:18px;padding:16px 18px}
.apply li{list-style:none;position:relative;padding-inline-start:26px;margin:6px 0;line-height:1.85}
.apply li::before{content:"";position:absolute;inset-inline-start:2px;top:.55em;width:12px;height:12px;border:2px solid var(--teal);border-radius:4px}
.reflect{font-family:"IBM Plex Sans Arabic";font-size:17px;text-align:center;padding:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink2)}
.rights{margin-top:22px;background:#efebe1;border-radius:16px;padding:14px 16px;font-size:12.5px;color:var(--ink2);line-height:1.9}
.rights b{color:var(--ink)}

/* المحاور */
.axc{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;color:var(--ink)}
.axc .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.axc .ic svg{width:26px;height:26px}
.axc b{display:block;font-size:16px;line-height:1.5}
.axc small{color:var(--ink2);font-size:13px}
.axc .n{margin-inline-start:auto;text-align:center;line-height:1.2;color:var(--teal)}
.axc .n b{font-size:22px}

/* المشاركون */
.pp{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.pp .av{width:44px;height:44px;font-size:16px;margin:0;border:0}
.pp b{display:block;font-size:15px}
.pp small{font-size:12.5px;color:var(--ink2)}
.pp .cnt{margin-inline-start:auto;text-align:center;line-height:1.2}
.pp .cnt b{font-size:20px;color:var(--teal)}
.medal{font-size:11px;background:var(--gold-s);color:#8a6418;border-radius:99px;padding:0 8px;font-weight:700;margin-inline-start:6px}

/* عن */
.charter{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 20px}
.charter div{padding:14px 0;border-bottom:1px solid var(--line);font-family:"IBM Plex Sans Arabic";font-size:17px;line-height:1.9}
.charter div:last-child{border:0}
.charter div::before{content:"❝ ";color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.tbl tr:last-child td{border:0}
.tbl td:first-child{font-weight:700;width:30%;color:var(--teal)}
.credits{display:grid;gap:10px}
.cr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.cr small{display:block;color:var(--muted);font-size:12px}
.cr b{font-size:15.5px}

.search{position:relative;margin-bottom:14px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 44px 12px 14px;outline:none}
.search input:focus{border-color:var(--teal)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:19px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
.filters button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}

/* الشريط السفلي */
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);font-weight:500;padding:4px 0}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--teal);font-weight:700}
.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot-credit{text-align:center;font-size:12px;color:var(--muted);margin-top:30px;line-height:1.9}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- الطباعة (PDF) ---------- */
#print{display:none}
@page{size:A4;margin:16mm 16mm 18mm}
@media print{
  body{background:#fff;font-size:11pt}
  .hdr,nav.tabs,main,.toast{display:none!important}
  #print{display:block}
  .pg{break-after:page}
  .pg:last-child{break-after:auto}
  .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--teal);padding-bottom:8px;margin-bottom:14px}
  .ph .brand{color:var(--teal)}
  .ph .brand b{color:var(--teal)}
  .ph .brand small{color:var(--gold)}
  .ph .r{text-align:left;font-size:9pt;color:var(--ink2);line-height:1.6}
  .sess-h,.ct .bub,.ref,.apply,.sum{break-inside:avoid}
  .sess-h{border-radius:10px}
  .sum{background:#f3f7f7!important;color:var(--ink)!important;border:1px solid #cfe0e1}
  .sum h3{color:var(--teal)!important}
  .sum li::before{background:var(--teal-s)!important;color:var(--teal)!important}
  .actions,.back{display:none!important}
  .blk>h3{break-after:avoid}
  .note-m,.ct{break-inside:avoid}
  .cover{height:250mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .cover svg{width:110px;height:110px}
  .cover h1{font-family:"IBM Plex Sans Arabic";font-size:34pt;color:var(--teal);margin:14px 0 2px}
  .cover .en{letter-spacing:6px;color:var(--gold);font-weight:700}
  .cover p{color:var(--ink2);margin-top:8px}
  .toc li{display:flex;justify-content:space-between;border-bottom:1px dotted #ccc;padding:5px 0;list-style:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- ===================== الشعار ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="madarFront"><rect x="0" y="60" width="120" height="60"/></clipPath>
  <symbol id="madar" viewBox="0 0 120 120">
    <g transform="rotate(-28 60 60)"><ellipse cx="60" cy="60" rx="54" ry="22" fill="none" stroke="var(--o,#e9c27a)" stroke-width="5"/></g>
    <circle cx="60" cy="60" r="23" fill="var(--c,#fff)"/>
    <g transform="rotate(-28 60 60)"><ellipse cx="60" cy="60" rx="54" ry="22" fill="none" stroke="var(--o,#e9c27a)" stroke-width="5" clip-path="url(#madarFront)"/></g>
    <path d="M48 51h24M48 59h24M58 67h14" stroke="var(--l,#0b3f45)" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="13" cy="85" r="8.5" fill="#c99a3d"/>
  </symbol>
  <symbol id="i-law" viewBox="0 0 24 24"><path d="M12 3v18M5 21h14M6 7h12M6 7l-3 7a3 3 0 0 0 6 0zM18 7l-3 7a3 3 0 0 0 6 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-hr" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.6 3.2-5.4 6-5.4s5.2 1.8 6 5.4"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.6c2.4 0 4.2 1.6 5 4.4"/></g></symbol>
  <symbol id="i-eval" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16l1.6 1.6L14 14"/></g></symbol>
  <symbol id="i-guide" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></g></symbol>
  <symbol id="i-lead" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 20V10l8-6 8 6v10z"/><path d="M9.5 20v-5h5v5"/></g></symbol>
</defs></svg>

<header class="hdr"><div class="in">
  <a class="brand" href="#home" aria-label="مَدار — الرئيسية">
    <svg style="--o:#e9c27a;--c:#fff;--l:#0b3f45"><use href="#madar"/></svg>
    <span><b>مَدار</b><small>MADAR</small></span>
  </a>
  <a class="homebtn" href="#home" aria-label="الصفحة الرئيسية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>الرئيسية</a>

    const parts=f.formatToParts(x); const m=+parts.find(p=>p.type==="month").value, dd=+parts.find(p=>p.type==="day").value;
    if(m===9&&dd===1) return {days:i,lessons};
    const wd=new Date(x.toLocaleString("en-US",{timeZone:"Asia/Riyadh"})).getDay();
    if(i>0 && wd!==4 && wd!==5) lessons++;
  }
  return null;
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),2800); }
const axisChip = k => { const a=AXES[k]; return `<span class="chip" style="background:${a.s};color:${a.c}">${esc(a.short||a.name)}</span>`; };
const sorted = () => [...SESSIONS].sort((a,b)=>b.id-a.id);
const people = () => { const m=new Map(); SESSIONS.forEach(s=>allThread(s).forEach(t=>{ const k=whoKey(t); const e=m.get(k)||{t,count:0,sanad:0,sessions:new Set()}; e.count++; if(refsOf(t).length) e.sanad++; e.sessions.add(s.id); m.set(k,e); })); return [...m.values()].sort((a,b)=>b.sanad-a.sanad||b.count-a.count); };
const refLine = r => r.label ? `${esc(r.law)} • ${esc(AR(r.label))}` : `${esc(r.law)} • المادة ${AR(r.article)}${r.para?` • الفقرة ${AR(r.para)}`:""}${r.page?` • ص ${AR(r.page)}`:""}`;

/* ============ PDF ============ */
function printHeader(){ return `<div class="ph"><div class="brand"><svg style="width:40px;height:40px;--o:#0e5a63;--c:#0e5a63;--l:#fff"><use href="#madar"/></svg><span><b>مَدار</b><small>MADAR</small></span></div><div class="r">${esc(SITE)}<br>سلسلة «بين النص والتطبيق»</div></div>`; }
function doPrint(){ setTimeout(()=>{ try{ window.print(); }catch(e){ toast("افتح الرابط في المتصفح لتحميل PDF"); } },150); }
function printOne(id){
  const s=SESSIONS.find(x=>x.id===id);

  document.title=`مدار - اللقاء ${id} - ${AXES[s.axis].name}`; doPrint();

function printBook(){
  const list=[...SESSIONS].sort((a,b)=>a.id-b.id);

window.addEventListener("afterprint",()=>{ document.title="مَدار — بين النص والتطبيق"; });
async function shareS(id){
  const url=location.href.split("#")[0]+"#s-"+id;
  try{ await navigator.clipboard.writeText(url); toast("نُسخ رابط اللقاء، الصقه في المجموعة"); }catch(e){ toast(url); }
}

/* ============ التوجيه ============ */
let CUR="home";
function go(h){ h=(h||"home").replace(/^#/,""); try{ history.replaceState(null,"","#"+h); }catch(e){} route(h); }
function route(hh){
  const h=hh||(location.hash||"#home").slice(1)||"home"; CUR=h;
  let tab="home";
  if(h.startsWith("s-")){ vSession(+h.slice(2)); tab="sessions"; }
  else if(h.startsWith("axis-")){ vAxis(h.slice(5)); tab="axes"; }
  else if(h==="sessions"){ vSessions(); tab="sessions"; }
  else if(h==="axes"){ vAxes(); tab="axes"; }
  else if(h==="people"){ vPeople(); tab="people"; }
  else if(h==="about"){ vAbout(); tab="about"; }
  else vHome();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>route());
document.addEventListener("click",e=>{ const a=e.target.closest("a[href^='#']"); if(!a) return; e.preventDefault(); go(a.getAttribute("href")); });
route();
setInterval(()=>{ if(CUR==="home") vHome(); },60000);
</script>
